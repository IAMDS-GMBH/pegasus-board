# Backing services for host-native development (API and web run via pnpm).
# Usage: docker compose -f compose.dev.yml up -d
name: kaneo-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: kaneo-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaneo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kaneo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # The browser uploads directly to MinIO via presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: ${KANEO_CLIENT_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-kaneo-uploads}
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing "local/$$S3_BUCKET"
      '
    restart: "no"

volumes:
  postgres_data:
    # Reuses the volume of the previously hand-started kaneo-postgres container.
    name: kaneo_postgres_data
  minio_data:
