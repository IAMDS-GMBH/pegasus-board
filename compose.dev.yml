# Backing services for host-native development (API and web run via pnpm).
# Usage: docker compose -f compose.dev.yml up -d
# See ENVIRONMENT_SETUP.md for the matching .env values.
name: kaneo-dev

# Same MinIO build as the CI and storage contract tests. MINIO_IMAGE overrides it;
# the image must provide minio, mc and /bin/sh on its PATH.
x-minio-image: &minio-image ${MINIO_IMAGE:-bitnamilegacy/minio@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaneo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kaneo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: *minio-image
    # Skip the Bitnami entrypoint and run the server directly, as CI does.
    entrypoint: ["minio"]
    command: ["server", "/bitnami/minio/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      # The browser uploads directly to MinIO via presigned URLs.
      MINIO_API_CORS_ALLOW_ORIGIN: ${KANEO_CLIENT_URL:-http://localhost:5173}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    restart: unless-stopped

  minio-init:
    # The server image ships mc, so bucket setup needs no second image.
    image: *minio-image
    depends_on:
      - minio
    environment:
      # mc keeps its config under $HOME, which is not writable for the image user.
      HOME: /tmp
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-kaneo-uploads}
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 1; done;
      mc mb --ignore-existing "local/$$S3_BUCKET"
      '
    restart: "no"

volumes:
  postgres_data:
  minio_data:
